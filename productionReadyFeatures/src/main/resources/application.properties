spring.application.name=productionReadyFeatures
#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false
spring.datasource.username=root
spring.datasource.password=Manya@1704

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.devtools.restart.exclude=src/main/java/com/module4/productionReadyFeatures/productionReadyFeatures/dto/**
server.port=9000
employeeService.base.url=http://localhost:8080/

#Logging configuration
logging.level.com.module4.productionReadyFeatures.productionReadyFeatures.clients=trace
logging.level.com.module4.productionReadyFeatures.productionReadyFeatures.config=info
#logging.level.root=debug

logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] [%c{2.}] --- %m%n 
logging.file.name=application.log
logging.config=classpath:logback-spring.xml

#actuator configurations
management.endpoints.web.exposure.include=*
info.app.author=Manya Maheshwari
info.app.versions=3.0.0
info.app.documentation=https://codingshuttle.com/docs
management.endpoint.env.show-values=always
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
#springdoc.api-docs.enabled=false

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false